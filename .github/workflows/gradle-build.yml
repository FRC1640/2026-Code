name: Gradlew Build

on:
  pull_request:
    branches:
      - main
      - master

jobs:
  gradlew-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Run Gradle build
        run: ./gradlew build
